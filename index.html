<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoBin Finder</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Leaflet Map CSS -->
    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

</head>

<body>

<header>
    <h1>♻️ EcoBin Finder</h1>
    <p>Find nearby e-waste recycling bins across Singapore.</p>

    <button id="locateBtn">
        📍 Use My Location
    </button>
</header>

<main>

    <div id="map"></div>

    <div id="info">
        <h2>Bin Information</h2>
        <p>Select a recycling bin on the map to view its details.</p>
    </div>

</main>

<!-- Leaflet -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- JavaScript -->
<script src="script.js"></script>

<!-- Botpress goes here later -->

</body>
</html>
