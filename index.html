<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EcoBin Finder</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

</head>

<body>

<header>

    <h1>♻️ EcoBin Finder</h1>

    <p>Locate nearby e-waste recycling bins across Singapore.</p>

    <button id="locateBtn">
        📍 Find Nearest E-Waste Bins
    </button>

</header>

<main>

    <div id="map"></div>

    <div class="cards">

        <div id="info" class="card">

            <h2>📄 Bin Information</h2>

            <p>Select any recycling bin on the map.</p>

        </div>

        <div id="nearest" class="card">

            <h2>📍 Nearest Recycling Bins</h2>

            <ul id="nearestList">

                <li>Press the button above to begin.</li>

            </ul>

        </div>

    </div>

</main>

<footer>

    <p>Data Source: Singapore Government Open Data</p>

</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="script.js"></script>

<!-- Botpress code goes here later -->

</body>

</html>
